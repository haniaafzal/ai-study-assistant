<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyAI - Generate Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>Generate a Quiz</h1>
        <p>Paste your study notes below and generate a quiz from them.</p>

        <textarea
            id="notesInput"
            maxlength="20000"
            placeholder="Paste your notes here..."
        ></textarea>

        <p id="characterCount">0 / 20,000 characters</p>

        <p id="validationMessage">
            Add more notes to generate a good quiz (at least 200 characters).
        </p>

        <button id="generateQuizButton" disabled>
            Generate Quiz
        </button>
    </main>

    <script src="app.js"></script>
</body>
</html>
